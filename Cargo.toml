[package]
name = "kanvas"
version = "0.2.0"
edition = "2021"
description = "Editor desain native yang ringan: canvas infinite, frame tanpa batas, Google Fonts"
# `src/bin/kanvas-mcp.rs` = server MCP; `cargo run` tetap menjalankan aplikasinya.
default-run = "kanvas"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ureq = "2"
rfd = "0.15"
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
arboard = { version = "3", features = ["wayland-data-control"] }
ttf-parser = "0.25"
lyon_tessellation = "1.0.23"
i_overlay = "9.1.0"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31"] }
svg2pdf = { version = "0.13", default-features = false, features = ["image", "filters"] }
pdf-writer = "0.12"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
